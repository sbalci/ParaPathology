# Builds the GitBook-safe copy of the vault and publishes it to the
# `gitbook-publish` branch, which GitBook's Git Sync reads.
#
# master keeps [[wikilinks]] (Tolaria / Obsidian); the copy has real Markdown
# links, fresh "In this section" and "See also" blocks, and plain text wherever
# a link would leave the book. This workflow never writes to master.
#
# Guard: if the branch's last commit was not written by this workflow (for
# example an edit merged in the GitBook editor), the run fails instead of
# overwriting it. Port that edit to master, then re-run with force=true.
name: gitbook-publish

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite gitbook-publish even if its last commit did not come from this workflow"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gitbook-publish
  cancel-in-progress: true

jobs:
  publish:
    # a manual run from another branch must never publish that branch
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the GitBook copy
        run: python tools/generate_summary.py publish --out "$RUNNER_TEMP/build"

      - name: Publish to the gitbook-publish branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"          # the master commit actually built
          TAG="chore(gitbook-publish): sync from master@"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PUB="$RUNNER_TEMP/publish"

          # exit 2 = the branch does not exist yet; anything else is a real failure
          if git ls-remote --exit-code --heads "$URL" gitbook-publish >/dev/null; then rc=0; else rc=$?; fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::Could not query the gitbook-publish branch (git ls-remote exit $rc)."
            exit 1
          fi

          if [ "$rc" -eq 0 ]; then
            git clone --quiet --depth 1 --branch gitbook-publish --single-branch "$URL" "$PUB"
            LAST="$(git -C "$PUB" log -1 --format=%s)"
            if [[ "$LAST" != "$TAG"* && "$FORCE" != "true" ]]; then
              echo "::error::gitbook-publish HEAD was not written by this workflow: '$LAST'."
              echo "::error::It may hold an edit made in GitBook. Port it to master, then re-run with force=true."
              exit 1
            fi
          else
            mkdir -p "$PUB"
            git -C "$PUB" init --quiet --initial-branch gitbook-publish
            git -C "$PUB" remote add origin "$URL"
          fi

          find "$PUB" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/build/." "$PUB/"

          git -C "$PUB" config user.name "github-actions[bot]"
          git -C "$PUB" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PUB" add -A
          if git -C "$PUB" rev-parse --verify --quiet HEAD >/dev/null \
             && git -C "$PUB" diff --cached --quiet; then
            echo "gitbook-publish is already up to date with master@${SOURCE_SHA}"
            exit 0
          fi
          git -C "$PUB" commit --quiet -m "${TAG}${SOURCE_SHA}"
          git -C "$PUB" push --quiet origin gitbook-publish
          echo "published master@${SOURCE_SHA} to gitbook-publish"
